[project]
name = "masoon"
version = "0.1.0"
description = "Framework-agnostic authentication and authorization for Python."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "alimunfed17", email = "alimunfed17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["authentication", "authorization", "auth", "rbac", "security", "identity"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/getmasoon/masoon"
Repository = "https://github.com/getmasoon/masoon"
Issues = "https://github.com/getmasoon/masoon/issues"

[project.optional-dependencies]
argon2 = [
    "argon2-cffi>=25.1.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
    "typos>=1.51.1",
    "zizmor>=1.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # no copyright header required in every file
    "D203",    # conflicts with D211 (no blank line before class docstring)
    "D213",    # conflicts with D212 (summary on the first docstring line)
    "COM812",  # conflicts with ruff format
    "ISC001",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "S105",     # fake password strings in tests are fine
    "S106",     # fake password arguments in tests are fine
    "D",        # test functions don't need docstrings
    "PLR2004",  # literal values in assertions are fine
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["masoon", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
